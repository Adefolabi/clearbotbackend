name: CI

# Tests only. Deployment is handled by Railway's own GitHub integration; in Railway,
# enable "Wait for CI" on the service so a failing run here blocks the deploy.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Tests stub the browser, so skip the Chromium download.
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run tests
        run: npm test
